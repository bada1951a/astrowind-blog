site:
  name: 'Daily Insight'
  site: 'https://post.storydailyview.com'
  base: '/'
  trailingSlash: false

  googleSiteVerificationId: false

# Metadata
metadata:
  title:
    default: '데일리 인사이트'
    template: '%s — 데일리 인사이트'
  description: '매일 만나는 알짜 핫이슈와 유용한 정보 큐레이션'
  robots:
    index: true
    follow: true
  openGraph:
    site_name: '데일리 인사이트'
    type: website

i18n:
  language: ko
  textDirection: ltr

apps:
  blog:
    isEnabled: true
    postsPerPage: 6
    post:
      isEnabled: true
      permalink: '/%slug%'
      robots:
        index: true
    list:
      isEnabled: true
      pathname: 'blog'
      robots:
        index: true
    category:
      isEnabled: true
      pathname: 'category'
      robots:
        index: true
    tag:
      isEnabled: true
      pathname: 'tag'
      robots:
        index: true

ui:
  theme: 'system'
  announcement:
    isEnabled: false
