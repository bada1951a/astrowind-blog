name: Update Blog Images Automatically

on:
  workflow_dispatch: # 깃허브 웹에서 버튼 하나로 수동 실행

jobs:
  update-images:
    runs-on: ubuntu-latest
    steps:
      - name: 깃허브 코드 가져오기
        uses: actions/checkout@v3

      - name: 파이썬 설정
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 기존 이미지 교체 및 tech-photo 사진 삽입 로직 실행
        run: |
          python -c "
          import os
          import random
          import re
          from pathlib import Path

          posts_dir = Path('src/data/post')
          target_img_dir = Path('public/images/tech-photo')

          available_images = []
          if target_img_dir.exists():
              available_images = [img.name for img in target_img_dir.glob('*.*') if img.suffix.lower() in ('.jpg', '.jpeg', '.png', '.webp')]

          if available_images:
              random.shuffle(available_images)
              pool_index = 0
              total_imgs = len(available_images)

              count = 0
              for md_file in posts_dir.glob('*.md'):
                  with open(md_file, 'r', encoding='utf-8') as f:
                      content = f.read()
                  
                  # 1. 기존에 들어가 있던 모든 마크다운 이미지(![...](...)) 또는 HTML 이미지(<img ...>) 태그 제거
                  content_clean = re.sub(r'!\[.*?\]\(.*?\)', '', content)
                  content_clean = re.sub(r'<img[^>]*>', '', content_clean)
                  
                  # 2. 새로운 tech-photo 이미지 선택 (순환 로직 적용)
                  chosen_img = available_images[pool_index]
                  pool_index = (pool_index + 1) % total_imgs
                  new_img_tag = f'\n\n![image](/images/tech-photo/{chosen_img})\n\n'
                  
                  # 3. 본문 상단(frontmatter 바로 다음 혹은 첫 번째 줄)에 새 이미지 삽입
                  # YAML Frontmatter(---로 감싸진 메타데이터) 바로 아래에 이미지가 들어가도록 처리
                  if '---' in content_clean:
                      parts = content_clean.split('---', 2)
                      if len(parts) >= 3:
                          # frontmatter 뒤에 이미지 삽입
                          new_content = parts[0] + '---' + parts[1] + '---' + new_img_tag + parts[2]
                      else:
                          new_content = new_img_tag + content_clean
                  else:
                      new_content = new_img_tag + content_clean
                  
                  if new_content != content:
                      with open(md_file, 'w', encoding='utf-8') as f:
                          f.write(new_content)
                      count += 1
                      print(f'[{md_file.name}] -> tech-photo/{chosen_img} 삽입 완료')

              print(f'총 {count}개 포스트 이미지 교체 및 삽입 완료!')
          else:
              print('public/images/tech-photo 폴더에 사용 가능한 이미지가 없습니다.')
          "

      - name: 변경된 파일 한 번에 깃허브에 자동 저장(Commit)
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Update: Replace old images with balanced tech-photo images"
          branch: main
