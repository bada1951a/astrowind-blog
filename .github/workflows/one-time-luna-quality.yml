name: One-Time 1ho GPT Luna Quality Sample (No Publish)
on:
  push:
    branches:
      - review/gpt6-luna-1ho-no-publish
    paths:
      - .one-time-1ho-luna-sample-trigger
permissions:
  contents: read
jobs:
  sample:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate one paid Korean article without publishing
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node scripts/one-time-luna-sample.mjs
      - name: Save sample for private editorial inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: one-time-1ho-korean-luna-sample
          path: tmp-luna-quality-review/ko-sample.md
          if-no-files-found: ignore
          retention-days: 1
