name: Fix All Markdown Formatting

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-markdown:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Markdown Fixer
        run: node fix-markdown.mjs

      - name: Commit and Push Fixed Posts
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/post
          if git diff --staged --quiet; then
            echo "수정할 변경 사항이 없습니다."
          else
            git commit -m "Fix: Batch fix all markdown formatting glitch"
            git push origin main
          fi
