name: Auto Multi-Language Blog Publishing Pipeline

on:
  schedule:
    - cron: '28 18 * * *'
      timezone: 'Asia/Seoul'
  workflow_dispatch: # Actions 탭에서 수동 실행 가능

concurrency:
  group: blog-publish-${{ github.repository }}
  cancel-in-progress: false
  queue: max
permissions:
  contents: write # 생성된 새 글을 GitHub 리포지토리에 푸시하기 위한 필수 권한

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require the main branch for scheduled publishing
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Budget-protected publishing is allowed only from main."
            exit 1
          fi

      - name: Restore one-topic locale recovery cache
        uses: actions/cache/restore@v4
        with:
          path: .generation-recovery/
          key: 1ho-astrowind-blog-recovery-encrypted-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            1ho-astrowind-blog-recovery-encrypted-v1-

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run Auto Publishing Script
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          OPENAI_BUDGET_LEDGER_BRANCH: automation/openai-budget-ledger
        run: |
          npm ci --legacy-peer-deps
          node generate-all.mjs
          npm run build

      - name: Commit and Push New Posts
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/post/ topics.txt
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto published new multi-language tech posts"
            git pull --rebase --autostash origin main
          fi
          git push

      - name: Report monthly API budget
        if: always()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          OPENAI_BUDGET_LEDGER_BRANCH: automation/openai-budget-ledger
        run: node openai-budget.mjs summary >> "$GITHUB_STEP_SUMMARY"

      - name: Save one-topic locale recovery cache
        if: always() && hashFiles('.generation-recovery/**') != ''
        uses: actions/cache/save@v4
        with:
          path: .generation-recovery/
          key: 1ho-astrowind-blog-recovery-encrypted-v1-${{ github.run_id }}-${{ github.run_attempt }}
