name: Auto Multi-Language Blog Publishing Pipeline

on:
  schedule:
    # 한국 시간 기준: 밤 20:58 (밤 9시 직전) / 아침 05:58 (아침 6시 직전)
    # 정각 00분 트래픽 병목을 피해 즉시 실행되는 58분 세팅
    # UTC 11:58 -> KST 20:58
    # UTC 20:58 -> KST 05:58
    - cron: '58 11,20 * * *'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run Multi-Language Generator Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node generate-all.mjs

      - name: Commit and Push New Posts & Updated Topics
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/post/ topics.txt
          if git diff --staged --quiet; then
            echo "변경사항이 없습니다."
          else
            git commit -m "chore: auto-publish 12-language blog posts [skip ci]"
            git push origin main
          fi
