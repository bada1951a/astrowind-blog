name: Auto Multi-Language Blog Publishing Pipeline

on:
  schedule:
    # 매일 한국 시각 오후 07:00 (UTC 10:00)
    - cron: '0 10 * * *'
  workflow_dispatch: # Actions 탭에서 수동 실행 가능

permissions:
  contents: write # 생성된 새 글을 GitHub 리포지토리에 푸시하기 위한 필수 권한

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Auto Publishing Script
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          npm install --legacy-peer-deps
          node generate-all.mjs

      - name: Commit and Push New Posts
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/post/ topics.txt
          git commit -m "Auto published new multi-language tech posts" || echo "No changes to commit"
          git push
