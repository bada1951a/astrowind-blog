name: Daily 12-Language Auto Publish

on:
  schedule:
    # 매일 한국 시간 오전 09:00에 자동 실행 (UTC 00:00)
    - cron: '0 0 * * *'
  # 필요할 때 버튼 눌러서 즉시 실행도 가능
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v4

      - name: Node.js 환경 세팅
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Gemini SDK 설치
        run: npm install @google/genai

      - name: 12개국 글 자동 생성 및 topics.txt 갱신
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node generate-all.mjs

      - name: 변경된 글 및 topics.txt 자동 저장(Commit & Push)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-publish 12 languages and update topics" && git push)
