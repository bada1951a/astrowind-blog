name: Auto Multi-Language Blog Publishing Pipeline

on:
  schedule:
    - cron: '0 19 * * *'
      timezone: 'Asia/Seoul'
  workflow_dispatch: # Actions 탭에서 수동 실행 가능

concurrency:
  group: blog-publish-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false
  queue: max
permissions:
  contents: write # 생성된 새 글을 GitHub 리포지토리에 푸시하기 위한 필수 권한

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Restore one-topic locale recovery cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .generation-recovery/
            public/images/commons/
          key: 1ho-astrowind-blog-recovery-encrypted-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            1ho-astrowind-blog-recovery-encrypted-v1-

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run Auto Publishing Script
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          npm install --legacy-peer-deps
          node generate-all.mjs
          npm run build

      - name: Commit and Push New Posts
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/post/ topics.txt public/images/commons/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto published new multi-language tech posts"
          fi
          git push

      - name: Save one-topic locale recovery cache
        if: always() && hashFiles('.generation-recovery/**') != ''
        uses: actions/cache/save@v4
        with:
          path: |
            .generation-recovery/
            public/images/commons/
          key: 1ho-astrowind-blog-recovery-encrypted-v1-${{ github.run_id }}-${{ github.run_attempt }}
