name: Auto Multi-Language Blog Publishing Pipeline

on:
  schedule:
    # --------------------------------------------------------------------------
    # [미국 최대 시장(동부 뉴욕/워싱턴 기준) 오전 8시, 오후 5시 발행]
    # - UTC 12:00 -> 한국 시간 당일 오후 9시 (21:00) / 미국 동부 오전 08:00
    # - UTC 21:00 -> 한국 시간 다음날 오전 6시 (06:00) / 미국 동부 오후 17:00
    # --------------------------------------------------------------------------
    - cron: '0 12,21 * * *'

  # GitHub Actions 콘솔에서 언제든 수동으로 즉시 실행할 수 있는 버튼 활성화
  workflow_dispatch:

permissions:
  contents: write # 파일 커밋 및 푸시 권한 부여

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm' # npm 캐시 활성화로 빌드 속도 향상

      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run Auto Publishing Script (Gemini 3.5 Flash-Lite)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node generate-all.mjs

      - name: Commit and Push Generated Posts
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # 새로 생성된 글과 수정된 topics.txt를 스테이징
          git add src/data/post/ topics.txt

          # 변경 사항이 있을 때만 커밋 및 푸시 실행 (오류 방지)
          if git diff --staged --quiet; then
            console.log "⚠️ 변경되거나 생성된 파일이 없습니다."
          else
            git commit -m "chore: auto-published 12-language posts [skip ci]"
            git push origin main
          fi
